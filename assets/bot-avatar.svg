<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="bg" cx="50%" cy="40%" r="78%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="55%" stop-color="#eef3f9"/>
      <stop offset="100%" stop-color="#dbe3ee"/>
    </radialGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#b4c6e0" stop-opacity="0.55"/>
      <stop offset="70%" stop-color="#b4c6e0" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#b4c6e0" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="navy" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2b4f83"/>
      <stop offset="100%" stop-color="#12294a"/>
    </linearGradient>
    <linearGradient id="red" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#e3283f"/>
      <stop offset="100%" stop-color="#b3182b"/>
    </linearGradient>
    <clipPath id="cap"><rect x="196" y="139" width="120" height="234" rx="60" ry="60"/></clipPath>
    <filter id="soft" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="9"/></filter>
    <filter id="shadow" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="16"/></filter>
  </defs>

  <rect width="512" height="512" fill="url(#bg)"/>

  <!-- faint concentric rings (brand motif) -->
  <g fill="none" stroke="#15315a" stroke-opacity="0.06" stroke-width="2">
    <circle cx="256" cy="256" r="118"/>
    <circle cx="256" cy="256" r="172"/>
    <circle cx="256" cy="256" r="226"/>
  </g>

  <!-- soft depth glow behind capsule -->
  <circle cx="256" cy="252" r="150" fill="url(#glow)"/>

  <!-- capsule, tilted -->
  <g transform="rotate(34 256 256)">
    <!-- floating shadow -->
    <ellipse cx="256" cy="360" rx="66" ry="16" fill="#15315a" opacity="0.20" filter="url(#shadow)"/>
    <g clip-path="url(#cap)">
      <rect x="196" y="139" width="120" height="234" fill="url(#navy)"/>
      <rect x="196" y="256" width="120" height="117" fill="url(#red)"/>
      <!-- seam between halves -->
      <rect x="196" y="251" width="120" height="9" fill="#0d1f37" opacity="0.5"/>
      <!-- glossy highlight -->
      <ellipse cx="226" cy="205" rx="15" ry="78" fill="#ffffff" opacity="0.30" filter="url(#soft)"/>
      <ellipse cx="288" cy="300" rx="9" ry="40" fill="#ffffff" opacity="0.12" filter="url(#soft)"/>
    </g>
    <!-- subtle rim light -->
    <rect x="196" y="139" width="120" height="234" rx="60" ry="60" fill="none" stroke="#ffffff" stroke-opacity="0.16" stroke-width="2"/>
  </g>
</svg>
